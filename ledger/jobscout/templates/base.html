<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ settings.APP_NAME }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,500&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;1,8..60,500&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
</head>
<body>
{% block body %}{% endblock %}
<script>
(function () {
  var root = document.documentElement;
  try {
    var saved = localStorage.getItem("jobscout-theme");
    root.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
  } catch (e) {}
  var btn = document.querySelector("[data-theme-toggle]");
  if (!btn) { return; }
  var moon = '<path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/>';
  var sun = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  function paint() {
    var icon = btn.querySelector("svg");
    if (icon) { icon.innerHTML = root.getAttribute("data-theme") === "dark" ? moon : sun; }
  }
  paint();
  btn.addEventListener("click", function () {
    var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("jobscout-theme", next); } catch (e) {}
    paint();
  });
})();
</script>
</body>
</html>
